services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --certificatesResolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesResolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.le.acme.httpChallenge.entryPoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  frontend:
    build: ./frontend
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.wos-front.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.wos-front.entryPoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.wos-front.tls.certResolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.services.wos-front.loadbalancer.server.port=80

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # Le préfixe /api est porté par Nest (setGlobalPrefix) : pas de stripprefix.
      - traefik.http.routers.wos-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.wos-api.entryPoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.wos-api.tls.certResolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.services.wos-api.loadbalancer.server.port=3000

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback uniquement : accessible pour le dev local, jamais exposé sur le réseau.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # pg18 : le montage se fait sur le parent, les données vont dans un sous-dossier versionné.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
  letsencrypt:
